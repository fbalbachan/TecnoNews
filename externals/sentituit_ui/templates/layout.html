<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>{{app.config["TITLE"].decode("utf-8")}}</title>
        <script src={{ url_for('static', filename="js/jquery.min.js") }}></script>
        <script src={{ url_for('static', filename="js/bootstrap.min.js") }}></script>
        <script src={{ url_for('static', filename="js/app.js") }}></script>
        <script src={{ url_for('static', filename="js/app.ui.js") }}></script>
        <script src={{ url_for('static', filename="js/app.ui.bootstrap.js") }}></script>
        <script src={{ url_for('static', filename="js/app.ui.fields.js") }}></script>
        
        <link href={{ url_for('static', filename="css/bootstrap.min.css") }} rel="stylesheet" type="text/css" />
        <link href={{ url_for('static', filename="css/bootstrap-theme.min.css") }} rel="stylesheet" type="text/css" />
        <link href={{ url_for('static', filename="css/font-awesome.css") }} rel="stylesheet" type="text/css" />
        <link href={{ url_for('static', filename="css/app.css") }} rel="stylesheet" type="text/css" />
        <link href={{ url_for('static', filename="css/animaciones.css") }} rel="stylesheet" type="text/css" />
    </head>
    <body>
        <div id="main-container">
        {%- if username in session %}
            <nav role="navigation" class="navbar navbar-default navbar-fixed-top">
                <div class="container-fluid">
                    <div class="navbar-header">
                        <button aria-controls="navbar" aria-expanded="false" data-target="#navbar" data-toggle="collapse" class="navbar-toggle collapsed" type="button">
                            <span class="sr-only">Toggle navigation</span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                        </button>
                        <a href="/admin" class="navbar-brand">Administración</a>
                    </div>
                    <div class="navbar-collapse collapse" id="navbar">
                        <ul class="nav navbar-nav">
                        </ul>
                        <ul class="nav navbar-nav navbar-right">
                            <li><a role="logout" href="/logout"><i class="glyphicon glyphicon-log-out"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        {%- endif %}
        {% block container %}{% endblock %}
        </div id="main-container">
    </body>
</html>
