$def with (result)
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
    function clearForms()
    {   
      var i;
      for (i = 0; (i < document.forms.length); i++) {
        document.forms[i].reset();
      } 
    }   
    </script>
  </head>
  <body onLoad="clearForms()" onUnload="clearForms()">
    Input sentence:<br>
    <p style="margin-right: 40px; margin-left: 40px; font-size: 14px;">$result['input_sentence']</p>
    <hr>

    <div>
      <table border="1" style="padding: 10px;">
    	<tr>
    	  <th>Subject</th>
    	  <th>Verb</th>
    	</tr>
    	<tr>
    	  <td style="padding: 10px; text-align: center;" title="$result['subject.msi']"> $result['subject']</td>
    	  <td style="padding: 10px; text-align: center;" title="$result['verb.msi']"> $result['verb']</td>
    	</tr>
      </table>
    </div>

    $if result['entities'] != []:
        <h3>Entities</h3>
	<ul>
	$for i, entity in enumerate(result['entities']):
	    <li title="$entity['msi']">$entity['entity']</li>
	</ul>

  </body>
</html>
