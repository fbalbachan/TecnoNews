$def with (input, output)
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Financial Compliance</title>
</head>
<body>
$ source = input.replace("\n", "<br>")
$ changed = output.replace("\n", "<br>")

<h3>Input text</h3>

<p>$:source</p>

<hr size="2">

<h3>Output text</h3>

<p>$:changed</p>

</body>
</html>
