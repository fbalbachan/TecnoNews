$def with (input_sentence, entities, parse_tree)
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
    function clearForms()
    {   
      var i;
      for (i = 0; (i < document.forms.length); i++) {
        document.forms[i].reset();
      } 
    }   
    </script>
  </head>
  <body onLoad="clearForms()" onUnload="clearForms()">
    Input sentence:<br>
    <p style="margin-right: 40px; margin-left: 40px; font-size: 14px;">$input_sentence</p>
    <hr>

    $if entities != []:
        <h3>Entities</h3>
        <div>
    	  <table border="1" style="padding: 10px;">
    	    <tr>
    	      <th>Sujeto</th>
    	      <th>Verbo</th>
    	      <th>Objeto</th>
    	    </tr>
    	    $for i, entity in enumerate(entities):
    	        <tr>
    		  <td style="padding: 10px; text-align: center;"> $entity.subject</td>
    		  <td style="padding: 10px; text-align: center;"> $entity.verb</td>
    		  <td style="padding: 10px; text-align: center;"> $entity.object</td>
    		</tr>
	   </table>
	 </div>
  </body>
</html>
